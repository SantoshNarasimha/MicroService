# Server Configuration
server.port=8080

# Application Name
spring.application.name=USER-SERVICE

# Load local configuration if available (for development)
spring.config.import=optional:file:./src/main/resources/application-local.properties



# Eureka Client Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MySQL Database Configuration
# Note: Set DB_USERNAME and DB_PASSWORD environment variables or use application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3307/user_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Santosh@2002

# Database Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

